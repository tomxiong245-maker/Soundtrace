<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>口癖与长停顿审核</title>
<style>
body{font:14px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;margin:0;background:#f4f6f8;color:#20242a}
header{position:sticky;top:0;z-index:3;background:#fff;border-bottom:1px solid #ddd;padding:12px 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
h1{font-size:17px;margin:0}.spacer{flex:1}button,input{font:inherit}button{padding:7px 13px;border:1px solid #bcc5d0;border-radius:6px;background:#fff;cursor:pointer}button.primary{background:#1769aa;color:#fff;border-color:#1769aa}button.delete{background:#fff;color:#a4261d;border-color:#d8a09b;font-weight:600}button.keep{background:#fff;color:#176b3a;border-color:#a4cbb2;font-weight:600}button.delete.selected{background:#b42318;color:#fff;border-color:#b42318}button.keep.selected{background:#16723a;color:#fff;border-color:#16723a}button:disabled{opacity:.4;cursor:not-allowed}
#app{max-width:1080px;margin:18px auto;padding:0 18px}.notice{padding:10px 13px;background:#fff4d6;border:1px solid #efd18b;border-radius:7px;margin-bottom:14px;white-space:pre-wrap}.card{background:#fff;border:1px solid #dfe3e8;border-radius:10px;padding:17px 19px;margin:14px 0}.card.accept{border:2px solid #d35b53}.card.reject{border:2px solid #4c9b69}.head{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.badge{font-size:12px;border-radius:12px;padding:3px 9px;background:#edf1f5}.badge.accept{background:#ffe2df;color:#8f1d16}.badge.reject{background:#dff1e5;color:#145c31}.tag{font-size:12px;padding:3px 8px;border-radius:12px;background:#e8eef7;color:#315579}
.transcript{margin:12px 0;padding:12px 13px;border:1px solid #e1e5e9;border-radius:6px;background:#fbfcfd;line-height:1.9}.transcript h2{font-size:13px;margin:0 0 6px;color:#4a5560}.track-line{margin:4px 0}.track-label{display:inline-block;width:110px;color:#65717d;font-weight:600}.word{display:inline;margin:0;padding:2px 0;border-radius:3px}.word.incut{background:#ffd9d6;color:#851b16;text-decoration:line-through;font-weight:650;padding:2px 1px}.pause-box{padding:12px;background:#eef7ff;border-left:3px solid #3178b8;line-height:1.7}.cut{margin:10px 0;padding:10px 12px;background:#fff1f0;border-left:3px solid #cb3a31;line-height:1.7}.cut small{display:block;margin-top:4px;color:#6e4a48}.audio-panel{margin-top:12px;padding:9px 11px;border:1px solid #e1e5e9;border-radius:6px;color:#46515c}.audio-panel summary{cursor:pointer;font-weight:600}.audio-row{display:grid;grid-template-columns:95px 1fr 120px;gap:8px;align-items:center;margin:8px 0}.audio-row audio{width:100%}.done{color:#16723a;font-weight:600}.pending{color:#6d747c}.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.actions [data-decision]{min-width:220px}.required-note{margin-top:10px;color:#8a4b09;font-weight:600}.status{white-space:pre-wrap;padding:10px;margin-top:12px;border-radius:6px;background:#eef2f6}.last-action{color:#32506d;font-weight:600}@media(max-width:650px){.audio-row{grid-template-columns:1fr}.audio-row audio{min-width:0}.track-label{display:block;width:auto}}
</style>
</head>
<body>
<header>
  <h1>口癖与长停顿审核</h1><span id="tracks">候选 –</span><span id="progress">进度 –</span><span id="lastAction" class="last-action" role="status" aria-live="polite"></span><div class="spacer"></div>
  <label>审核人 <input id="reviewer" placeholder="输入姓名"></label><button id="next">下一个未决 N</button><button id="submit" class="primary" disabled>固定审核结果</button>
</header>
<main id="app"><div class="notice">正在加载审核包…</div></main>
<script>
"use strict";
const state={pkg:null,decisions:{},events:[],startedAt:new Date().toISOString()};
const $=s=>document.querySelector(s);const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function log(type,data={}){state.events.push({at:new Date().toISOString(),type,...data})}
function key(){return "filler-global-pause:"+state.pkg.review_manifest_sha256}function save(){localStorage.setItem(key(),JSON.stringify(state.decisions));update()}
function d(cid){return state.decisions[cid]??={decision:"pending",listened:{}}}
function listened(cid,kind,sha){const x=d(cid);x.listened[kind+"_sha256"]=sha;x.listened[kind+"_listened_at"]=new Date().toISOString();log("preview_ended",{cid,kind});save();renderBadge(cid)}
function requiredDone(c,x){return (c.review_requirements?.must_listen_to||[]).every(k=>x.listened?.[k+"_sha256"]===c.previews[k+"_sha256"]&&x.listened?.[k+"_listened_at"])}
function basis(c,x){const l=x.listened||{},a=l.original_sha256===c.previews.original_sha256,b=l.proposed_cut_sha256===c.previews.proposed_cut_sha256;return a&&b?"text_and_audio":a||b?"text_with_audio":"text_only"}
function decide(cid,value){const c=state.pkg.candidates.find(x=>x.candidate_id===cid),x=d(cid);if(!requiredDone(c,x)){alert("这条候选必须先完整试听原音频和压缩后音频。请播放到结束。");return}const reviewer=$("#reviewer").value.trim();if(reviewer.length<2){alert("请先填写审核人姓名。");return}x.decision=value;x.reviewer=reviewer;x.decided_at=new Date().toISOString();x.candidate_semantic_sha256=c.semantic_sha256;log("decision",{cid,value});save();renderBadge(cid);$("#lastAction").textContent=cid+"："+(value==="accept"?"已选采用剪切（删掉建议区间）":"已选不剪（保留原音频）");setTimeout(jumpNext,350)}
function renderBadge(cid){const x=state.decisions[cid]||{},card=document.querySelector('[data-card="'+cid+'"]');if(!card)return;const b=card.querySelector(".badge");b.className="badge "+(x.decision||"");b.textContent=x.decision==="accept"?"已选：采用剪切":x.decision==="reject"?"已选：保留原音频":"未决";card.classList.toggle("accept",x.decision==="accept");card.classList.toggle("reject",x.decision==="reject");card.querySelectorAll("[data-decision]").forEach(btn=>{const selected=btn.dataset.decision===x.decision;btn.classList.toggle("selected",selected);btn.setAttribute("aria-pressed",String(selected));});const c=state.pkg.candidates.find(y=>y.candidate_id===cid);for(const kind of ["original","proposed_cut"]){const ok=x.listened?.[kind+"_sha256"]===c.previews[kind+"_sha256"];const e=card.querySelector('[data-listen="'+kind+'"]');e.textContent=ok?"已听 ✓":"未试听";e.className=ok?"done":"pending"}const note=card.querySelector(".required-note");if(note)note.textContent=requiredDone(c,x)?"已完成必听：可以作出决定。":"长停顿候选必须听完原音频和压缩后音频。"}
function inCut(w,c){return w.end_seconds>c.start_seconds&&w.start_seconds<c.end_seconds}
function words(words,c){if(!words?.length)return '<span style="color:#999">（这条候选没有文字证据，请以音频为准。）</span>';return words.map(w=>'<span class="word '+(inCut(w,c)?"incut":"")+'">'+esc(w.text)+" </span>").join("")}
function sourceText(c){const source=c.text_tracks?.[c.source_track_id];return source?words(source.words,c):""}
function reason(c){return c.candidate_kind==="global_long_pause"?"全轨共同长停顿":c.filler_subtype==="repeated_weak_filler"?"重复口癖（保留最后一个）":"明显犹豫音"}
function render(){$("#tracks").textContent="候选 "+state.pkg.candidates.length;$("#app").innerHTML='<div class="notice"><b>本轮范围：</b>只审核口癖和全轨共同长停顿。所有候选都必须由真人决定；本页面固定的是审核决定，不会自动生成 EDL、不会改原始 WAV、不会渲染或发布。红色部分是建议剪掉的区间。</div>'+state.pkg.candidates.map(c=>{const pause=c.candidate_kind==="global_long_pause", req=c.review_requirements?.must_listen_to||[], source=c.text_tracks?.[c.source_track_id];let body=pause?'<div class="pause-box">'+esc(c.review_display?.summary||"全轨共同空白")+'</div>':'<div class="transcript"><h2>来源轨转写</h2>'+sourceText(c)+'</div><div class="cut"><b>建议删掉：</b>'+esc(c.proposed_delete_text||"")+"<small>完整证据："+esc(c.evidence_text||"")+"；重复弱口癖会保留最后一个词。</small></div>";if(pause)body+='<div class="transcript"><h2>所有轨上下文</h2>'+Object.entries(c.text_tracks||{}).map(([id,t])=>'<div class="track-line"><span class="track-label">'+esc(t.label||id)+"</span>"+words(t.words,c)+"</div>").join("")+'</div>';return '<section class="card" data-card="'+c.candidate_id+'"><div class="head"><b>'+c.candidate_id+'</b><span class="tag">'+esc(reason(c))+'</span><span class="badge">未决</span></div>'+body+'<details class="audio-panel"><summary>试听 A/B（'+(req.length?"本条必听":"可选")+'）</summary><div class="audio-row"><span>原音频</span><audio controls preload="metadata" data-kind="original" src="'+esc(c.previews.original_path)+'"></audio><span data-listen="original" class="pending">未试听</span></div><div class="audio-row"><span>压缩后</span><audio controls preload="metadata" data-kind="proposed_cut" src="'+esc(c.previews.proposed_cut_path)+'"></audio><span data-listen="proposed_cut" class="pending">未试听</span></div></details>'+(req.length?'<div class="required-note">长停顿候选必须听完原音频和压缩后音频。</div>':'')+'<div class="actions"><button class="delete" data-decision="accept" aria-pressed="false">采用剪切（删掉建议区间） · 1</button><button class="keep" data-decision="reject" aria-pressed="false">不剪（保留原音频） · 2</button></div></section>'}).join('')+'<div id="result" class="status" role="status">尚未固定审核结果。</div>';document.querySelectorAll(".card").forEach(card=>{const cid=card.dataset.card,c=state.pkg.candidates.find(x=>x.candidate_id===cid);card.querySelectorAll("audio").forEach(a=>a.addEventListener("ended",()=>listened(cid,a.dataset.kind,c.previews[a.dataset.kind+"_sha256"])));card.querySelectorAll("[data-decision]").forEach(b=>b.addEventListener("click",()=>decide(cid,b.dataset.decision)));renderBadge(cid)});update()}
function update(){if(!state.pkg)return;const done=state.pkg.candidates.filter(c=>["accept","reject"].includes(state.decisions[c.candidate_id]?.decision)&&requiredDone(c,state.decisions[c.candidate_id]||{})).length;$("#progress").textContent="进度 "+done+"/"+state.pkg.candidates.length;$("#submit").disabled=done!==state.pkg.candidates.length||$("#reviewer").value.trim().length<2}
function jumpNext(){const c=state.pkg.candidates.find(x=>!(["accept","reject"].includes(state.decisions[x.candidate_id]?.decision)&&requiredDone(x,state.decisions[x.candidate_id]||{})));if(c)document.querySelector('[data-card="'+c.candidate_id+'"]').scrollIntoView({behavior:"smooth",block:"center"})}
function decisionsDoc(){const reviewer=$("#reviewer").value.trim();return{schema_version:"human-decisions-mvp-v1",package_id:state.pkg.package_id,review_manifest_sha256:state.pkg.review_manifest_sha256,reviewer,session_started_at:state.startedAt,session_ended_at:new Date().toISOString(),decisions:state.pkg.candidates.map(c=>{const x=state.decisions[c.candidate_id];return{candidate_id:c.candidate_id,candidate_semantic_sha256:c.semantic_sha256,decision:x.decision,reviewer,decided_at:x.decided_at,review_basis:basis(c,x),listened_previews:x.listened||{}}})}}
$("#reviewer").addEventListener("input",update);$("#next").addEventListener("click",jumpNext);$("#submit").addEventListener("click",async()=>{const button=$("#submit"),doc=decisionsDoc(),metrics={schema_version:"review-session-metrics-mvp-v1",package_id:state.pkg.package_id,reviewer:doc.reviewer,started_at:state.startedAt,ended_at:new Date().toISOString(),events:state.events};button.disabled=true;button.textContent="固定中…";try{const res=await fetch("/api/submit",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({decisions:doc,metrics})}),body=await res.json();if(!res.ok)throw new Error((body.errors||["未知后端错误"]).join("；"));$("#result").textContent="审核决定已固定。\n"+body.decisions_path+"\n本轮未生成 EDL、未渲染、未发布。";$("#lastAction").textContent="已固定 ✓";button.textContent="已固定 ✓"}catch(e){$("#result").textContent="固定失败：\n"+String(e.message||e);$("#lastAction").textContent="固定失败";button.textContent="重试固定"}finally{update()}});document.addEventListener("keydown",e=>{if(["INPUT","TEXTAREA"].includes(document.activeElement?.tagName))return;const card=document.elementFromPoint(innerWidth/2,innerHeight/2)?.closest(".card");if(!card)return;if(e.key==="1")decide(card.dataset.card,"accept");if(e.key==="2")decide(card.dataset.card,"reject");if(e.key.toLowerCase()==="n")jumpNext});fetch("review_package.json").then(r=>r.json()).then(pkg=>{state.pkg=pkg;try{state.decisions=JSON.parse(localStorage.getItem(key())||"{}")}catch{}render()}).catch(e=>{$("#app").innerHTML='<div class="notice">加载失败：'+esc(e)+'</div>'});
</script>
</body>
</html>
